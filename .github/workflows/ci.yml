name: CI & Release Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Rust unit tests
        run: cargo test -p pomodoro-core

      - name: Run Rust Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Run frontend typecheck and unit tests
        run: |
          npm run check
          npm test

      - name: Build Tauri NSIS installer
        run: npm run tauri build

      - name: Upload NSIS Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pomodoro-Companion-Windows-Installer
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/pomodoro-companion.exe

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Pomodoro Companion ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            target/release/bundle/nsis/*-setup.exe
            target/release/pomodoro-companion.exe
